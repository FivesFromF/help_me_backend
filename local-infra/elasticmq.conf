# ElasticMQ — the actual SQS implementation behind local-infra's `serverless-offline-sqs`.
#
# The plugin does NOT start a queue system; its own README says so: "To be able to emulate AWS SQS
# queue on local machine there should be some queue system actually running." Nothing was running,
# which is why the AI worker error-looped on :9324 no matter how its endpoint was pointed.
#
# Queues are declared here rather than left to the plugin's `autoCreate`, so the queue exists as
# soon as the container is up — independent of whether the serverless stack is running at all.

include classpath("application.conf")

node-address {
  protocol = http
  # "*" makes returned queue URLs echo the request's Host header, so the same queue answers to
  # `elasticmq:9324` from the compose network and `localhost:9324` from the host.
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  helpme-ai-jobs-queue {
    defaultVisibilityTimeout = 120 seconds
    deadLettersQueue {
      name = "helpme-ai-jobs-dlq"
      maxReceiveCount = 3
    }
  }
  helpme-ai-jobs-dlq { }
}

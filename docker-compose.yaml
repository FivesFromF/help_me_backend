version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: helpme-db-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: helpme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-server:
    build:
      context: src/services/ai-server
      dockerfile: Dockerfile
    container_name: helpme-ai-server
    restart: always

  write-server:
    build:
      context: .
      dockerfile: src/services/write-server/Dockerfile
    container_name: helpme-write-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:password@db:5432/helpme
      - SYSTEM_SECRET=helpme-secret-key
    depends_on:
      - db
    restart: always

  read-server:
    build:
      context: .
      dockerfile: src/services/read-server/Dockerfile
    container_name: helpme-read-server
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://postgres:password@db:5432/helpme
      - SYSTEM_SECRET=helpme-secret-key
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:

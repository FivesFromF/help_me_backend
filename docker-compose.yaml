version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: helpme-db-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: helpme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: helpme-ddb-local
    # dbPath (not -inMemory) so the tables survive a container restart, the same way
    # postgres_data keeps the relational data.
    user: root
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    ports:
      - "8001:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    restart: always

  # Creates the two tables the API expects. Idempotent: re-running is a no-op, so it is
  # safe on every `docker compose up`. Exits once the tables exist.
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: helpme-ddb-init
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-southeast-1
    entrypoint: ["/bin/sh", "-c"]
    # Single-item list: a plain string here would be word-split and only the first
    # token would reach `sh -c`.
    command:
      - |
        set -e
        EP=http://dynamodb:8000
        until aws dynamodb list-tables --endpoint-url $$EP >/dev/null 2>&1; do
          echo "waiting for dynamodb..."
          sleep 2
        done
        aws dynamodb create-table --endpoint-url $$EP           --table-name helpme-scan-jobs           --attribute-definitions AttributeName=job_id,AttributeType=S           --key-schema AttributeName=job_id,KeyType=HASH           --billing-mode PAY_PER_REQUEST >/dev/null 2>&1 || echo "helpme-scan-jobs exists"
        aws dynamodb create-table --endpoint-url $$EP           --table-name helpme-audit-logs           --attribute-definitions AttributeName=actor_id,AttributeType=S AttributeName=timestamp,AttributeType=S           --key-schema AttributeName=actor_id,KeyType=HASH AttributeName=timestamp,KeyType=RANGE           --billing-mode PAY_PER_REQUEST >/dev/null 2>&1 || echo "helpme-audit-logs exists"
        aws dynamodb list-tables --endpoint-url $$EP
    restart: "no"

  # SQS for the AI job queue. `serverless-offline-sqs` in local-infra is only a client-side
  # plugin — it needs a real queue system, and there was none, so :9324 never had a listener.
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: helpme-elasticmq
    ports:
      - "9324:9324"
    volumes:
      - ./local-infra/elasticmq.conf:/opt/elasticmq.conf:ro
    restart: always

  ai-server:
    build:
      context: src/services/ai-server
      dockerfile: Dockerfile
    container_name: helpme-ai-server
    # SQS, S3 and EventBridge live in the `local-infra` serverless stack, which runs on the HOST,
    # not on this network — hence host.docker.internal. DynamoDB and Postgres are compose services,
    # so they are reached by service name. Without these the worker falls back to `localhost`,
    # which inside the container is the container itself: it error-loops on
    # "Could not connect to the endpoint URL: http://localhost:9324/" forever.
    environment:
      - AWS_REGION=ap-southeast-1
      # S3RVER, not test: serverless-s3-local wraps s3rver, which registers exactly one key pair
      # (S3RVER/S3RVER, lib/models/account.js) and rejects every other key with 403 InvalidAccessKeyId
      # before checking the signature. custom.s3.accessKeyId does NOT change that — the plugin never
      # passes it to the server. boto3 has no per-service credentials, so this is global; harmless
      # because DynamoDB Local (-sharedDb) and ElasticMQ accept any key.
      - AWS_ACCESS_KEY_ID=S3RVER
      - AWS_SECRET_ACCESS_KEY=S3RVER
      # EventBridge — worker.py's events_client reads AWS_ENDPOINT_URL (its default is LocalStack's
      # :4566, which this project does not run).
      - AWS_ENDPOINT_URL=http://host.docker.internal:4010
      - SQS_ENDPOINT_URL=http://elasticmq:9324
      - S3_ENDPOINT_URL=http://host.docker.internal:4569
      - AI_JOBS_QUEUE_URL=http://elasticmq:9324/queue/helpme-ai-jobs-queue
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - DATABASE_URL=postgres://postgres:password@db:5432/helpme
      - AWS_S3_BUCKET=helpme-avatars-local
      - SCAN_JOBS_TABLE=helpme-scan-jobs
      - EMERGENCY_BUS_NAME=helpme-emergency-bus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - dynamodb
      - elasticmq
    restart: always

  write-server:
    build:
      context: .
      dockerfile: src/services/write-server/Dockerfile
    container_name: helpme-write-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:password@db:5432/helpme
      - SYSTEM_SECRET=helpme-secret-key
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - SCAN_JOBS_TABLE=helpme-scan-jobs
      - AUDIT_TABLE_NAME=helpme-audit-logs
      - AWS_S3_BUCKET=helpme-avatars-local
      - S3_ENDPOINT=http://host.docker.internal:4569
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - dynamodb
    restart: always

  read-server:
    build:
      context: .
      dockerfile: src/services/read-server/Dockerfile
    container_name: helpme-read-server
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://postgres:password@db:5432/helpme
      - SYSTEM_SECRET=helpme-secret-key
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - SCAN_JOBS_TABLE=helpme-scan-jobs
      - AUDIT_TABLE_NAME=helpme-audit-logs
      - AWS_S3_BUCKET=helpme-avatars-local
      - S3_ENDPOINT=http://host.docker.internal:4569
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - dynamodb
    restart: always

volumes:
  postgres_data:
  dynamodb_data:

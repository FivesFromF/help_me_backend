name: Deploy HelpMe Backend

# Builds the TypeScript Lambda bundles (dist/) + the Python AI Lambda container,
# then applies Terraform. This replaces the retired Go/ECS pipeline.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  PROJECT_NAME: helpme
  AI_ECR_REPO: helpme-ai-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps & bundle Lambdas
        run: |
          npm ci
          node build.js
          # Fail fast if any expected bundle is missing (Terraform archive_file reads these).
          for fn in authorizer read-service write-service post-confirmation \
                    audit-worker notification-worker grant-permission-worker; do
            test -f "dist/$fn/index.js" || { echo "::error::missing dist/$fn/index.js"; exit 1; }
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Generate terraform.tfvars
        run: |
          cat > infra/terraform.tfvars <<EOF
          project_name         = "${PROJECT_NAME}"
          aws_region           = "${AWS_REGION}"
          supabase_db_url      = "${{ secrets.SUPABASE_DB_URL }}"
          ai_internal_secret   = "${{ secrets.AI_INTERNAL_SECRET }}"
          system_secret        = "${{ secrets.SYSTEM_SECRET }}"
          google_client_id     = "${{ secrets.GOOGLE_CLIENT_ID }}"
          google_client_secret = "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          smtp_host            = "${{ secrets.SMTP_HOST }}"
          smtp_port            = "${{ secrets.SMTP_PORT }}"
          smtp_user            = "${{ secrets.SMTP_USER }}"
          smtp_pass            = "${{ secrets.SMTP_PASS }}"
          smtp_from            = "${{ secrets.SMTP_FROM }}"
          random_suffix        = "${{ secrets.RANDOM_SUFFIX }}"
          EOF

      - name: Terraform init
        run: terraform -chdir=infra init

      # The AI Lambda is a container image, so its ECR repo must exist and hold an
      # image BEFORE the Lambda resource can be created. Create just the repo first.
      - name: Ensure AI ECR repository exists
        run: terraform -chdir=infra apply -auto-approve -target=module.ai_service.aws_ecr_repository.ai

      - name: Build & push AI Lambda image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${ECR_REGISTRY}/${AI_ECR_REPO}:latest"
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
          docker build -t "${IMAGE}" src/functions/ai-service
          docker push "${IMAGE}"
          echo "AI_IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Terraform apply
        run: terraform -chdir=infra apply -auto-approve

      # The AI Lambda pins image_uri (ignore_changes) at the :latest tag, so a fresh
      # push does not roll the running function. Force it to adopt the new image.
      - name: Roll AI Lambda to new image
        run: |
          if aws lambda get-function --function-name "${AI_ECR_REPO}" >/dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name "${AI_ECR_REPO}" \
              --image-uri "${AI_IMAGE}" >/dev/null
            echo "Rolled ${AI_ECR_REPO} to ${AI_IMAGE}"
          fi

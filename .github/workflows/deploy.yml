name: Deploy HelpMe Backend

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Build and Package Lambdas
      run: |
        build_lambda() {
          local name=$1
          local target_path=$2
          cd src/cmd/$name
          GOOS=linux GOARCH=amd64 go build -o bootstrap main.go
          zip ../../../$target_path bootstrap
          rm bootstrap
          cd ../../../
        }
        mkdir -p infra/modules/lambda
        mkdir -p infra/modules/authorizer
        build_lambda "audit-worker" "infra/modules/lambda/audit_worker.zip"
        build_lambda "notification-worker" "infra/modules/lambda/notification_worker.zip"
        build_lambda "grant-permission-worker" "infra/modules/lambda/grant_permission_worker.zip"
        build_lambda "cognito-create-auth" "infra/modules/lambda/cognito_create_auth.zip"
        build_lambda "cognito-define-auth" "infra/modules/lambda/cognito_define_auth.zip"
        build_lambda "cognito-verify-auth" "infra/modules/lambda/cognito_verify_auth.zip"
        build_lambda "authorizer" "infra/modules/authorizer/authorizer.zip"

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Ensure ECR Repository Exists
      run: |
        aws ecr describe-repositories --repository-names helpme-backend || \
        aws ecr create-repository --repository-name helpme-backend

    - name: Build, Tag, and Push Docker Images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: helpme-backend
      run: |
        # Build and Push READ Service
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:read-latest -f src/read.Dockerfile src/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:read-latest
        echo "READ_IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:read-latest" >> $GITHUB_ENV

        # Build and Push WRITE Service
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:write-latest -f src/write.Dockerfile src/
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:write-latest
        echo "WRITE_IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:write-latest" >> $GITHUB_ENV

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Generate terraform.tfvars
      run: |
        cat <<EOF > infra/terraform.tfvars
        project_name           = "helpme"
        db_password            = "${{ secrets.DB_PASSWORD }}"
        read_container_image   = "${{ env.READ_IMAGE_URI }}"
        write_container_image  = "${{ env.WRITE_IMAGE_URI }}"
        system_secret          = "${{ secrets.SYSTEM_SECRET }}"
        aws_region             = "ap-southeast-1"
        EOF

    - name: Terraform Init & Apply
      run: |
        cd infra
        terraform init
        terraform apply -auto-approve

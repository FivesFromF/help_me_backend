version: "2"
sql:
  - schema: "api/schema/schema.sql"
    queries: "api/schema/query.sql"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "internal/repository/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: true
        overrides:
          - column: "citizens.face_embedding"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgv"
              type: "Vector"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"

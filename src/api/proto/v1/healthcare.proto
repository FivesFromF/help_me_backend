syntax = "proto3";

package helpme.v1;

option go_package = "github.com/fivesfromf/helpme/internal/gen/v1;helpmev1";

import "google/protobuf/timestamp.proto";
import "api/proto/v1/citizen.proto";

service HealthcareService {
  rpc GetData(GetMedicalRecordRequest) returns (GetMedicalRecordResponse);
  rpc LogAccess(LogAccessRequest) returns (LogAccessResponse);
}

message GetMedicalRecordRequest {
  string citizen_id = 1;
  string staff_id = 2; // Required for auditing
}

message GetMedicalRecordResponse {
  MedicalRecord record = 1;
}

message LogAccessRequest {
  string citizen_id = 1;
  string staff_id = 2;
  string reason = 3;
}

message LogAccessResponse {
  bool success = 1;
}

syntax = "proto3";

package helpme.v1;

option go_package = "github.com/fivesfromf/helpme/internal/gen/v1;helpmev1";

import "google/protobuf/timestamp.proto";

service CitizenService {
  // Profile Management
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  
  // Identity and Search
  rpc SearchByFace(SearchByFaceRequest) returns (SearchByFaceResponse);
  rpc VerifyIdentity(VerifyIdentityRequest) returns (VerifyIdentityResponse);

  // NFC & QR Management
  rpc RegisterNFCTag(RegisterNFCTagRequest) returns (RegisterNFCTagResponse);
  rpc CreateQRCode(CreateQRCodeRequest) returns (CreateQRCodeResponse);
  rpc UpdateTagStatus(UpdateTagStatusRequest) returns (UpdateTagStatusResponse);
}

message CitizenProfile {
  string id = 1;
  string full_name = 2;
  string date_of_birth = 3;
  string gender = 4;
  string address = 5;
  string email = 6;
  string phone = 7;
  string cccd_number = 8;
  string avatar_url = 9;
  google.protobuf.Timestamp created_at = 10;
}

message EmergencyContact {
  string id = 1;
  string full_name = 2;
  string address = 3;
  string phone1 = 4;
  string phone2 = 5;
  string relationship = 6;
}

message MedicalRecord {
  string citizen_id = 1;
  string distinguishing_marks = 2;
  string blood_group = 3;
  repeated string allergies = 4;
  repeated string background_diseases = 5;
  repeated string current_medications = 6;
  string notes = 7;
  google.protobuf.Timestamp last_updated = 8;
}

message RegisterRequest {
  string full_name = 1;
  string date_of_birth = 2;
  string gender = 3;
  string address = 4;
  string email = 5;
  string phone = 6;
  string cccd_number = 7;
  string avatar_url = 8;
  repeated float face_vector = 9;
  
  // Optional initial medical info
  MedicalRecord initial_medical_record = 10;
  repeated EmergencyContact emergency_contacts = 11;
}

message RegisterResponse {
  CitizenProfile profile = 1;
}

message GetProfileRequest {
  string id = 1;
}

message GetProfileResponse {
  CitizenProfile profile = 1;
  MedicalRecord medical_record = 2;
  repeated EmergencyContact emergency_contacts = 3;
}

message UpdateProfileRequest {
  string id = 1;
  optional string full_name = 2;
  optional string address = 3;
  optional string email = 4;
  optional string avatar_url = 5;
}

message UpdateProfileResponse {
  CitizenProfile profile = 1;
}

message SearchByFaceRequest {
  repeated float face_vector = 1;
}

message SearchByFaceResponse {
  CitizenProfile profile = 1;
  float match_score = 2;
}

// Verification Logic for NFC/QR
message VerifyIdentityRequest {
  oneof identifier {
    string nfc_id = 1;
    string qr_id = 2;
  }
  string hashed_citizen_id = 3; // Computed by App/Scanned from Tag
}

message VerifyIdentityResponse {
  CitizenProfile profile = 1;
  MedicalRecord medical_record = 2;
  repeated EmergencyContact emergency_contacts = 3;
}

// NFC/QR Management
message RegisterNFCTagRequest {
  string nfc_id = 1;
  string name = 2;
  string type = 3;
}

message RegisterNFCTagResponse {
  string nfc_id = 1;
  string status = 2;
}

message CreateQRCodeRequest {
  string name = 1;
}

message CreateQRCodeResponse {
  string qr_id = 1;
  string status = 2;
}

message UpdateTagStatusRequest {
  oneof identifier {
    string nfc_id = 1;
    string qr_id = 2;
  }
  string new_status = 3; // ACTIVE, INACTIVE, LOST, REVOKED
}

message UpdateTagStatusResponse {
  string status = 1;
}
